version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: food-ordering-db
    environment:
      POSTGRES_DB: food-ordering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1789"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food-ordering"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: food-ordering-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/food-ordering
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1789"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: food-ordering-super-secret-key-minimum-32-chars-ok
      JWT_EXPIRATION: "86400000"

volumes:
  postgres_data:
