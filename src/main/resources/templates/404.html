<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");

        :root {
            --navy: #0A2947;
            --cream: #F3E4C9;
            --sage: #D3D4C0;
            --brown: #8B5E3C;
            --bg: #fffaf3;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Be Vietnam Pro", Arial, sans-serif;
            color: var(--navy);
            background:
                radial-gradient(circle at 12% 14%, rgba(139, 94, 60, 0.16), transparent 260px),
                radial-gradient(circle at 92% 82%, rgba(10, 41, 71, 0.12), transparent 300px),
                linear-gradient(135deg, #fffaf3 0%, #f3e4c9 100%);
        }

        .error-card {
            width: min(560px, 100%);
            padding: 38px 30px;
            text-align: center;
            border-radius: 34px;
            background: rgba(255, 250, 243, 0.92);
            border: 1px solid rgba(211, 212, 192, 0.9);
            box-shadow: 0 24px 60px rgba(10, 41, 71, 0.16);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 28px;
            background: var(--brown);
            color: var(--cream);
            font-size: 38px;
            box-shadow: 0 14px 30px rgba(139, 94, 60, 0.24);
        }

        .label {
            display: inline-flex;
            padding: 8px 14px;
            margin-bottom: 16px;
            border-radius: 999px;
            color: var(--brown);
            background: rgba(139, 94, 60, 0.1);
            font-size: 13px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1;
            letter-spacing: -2px;
            font-weight: 800;
        }

        h2 {
            margin: 12px 0 10px;
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.15;
            font-weight: 800;
        }

        p {
            margin: 0 auto;
            max-width: 440px;
            color: var(--brown);
            font-size: 15px;
            line-height: 1.7;
            font-weight: 600;
        }

        .path {
            margin: 20px auto 0;
            padding: 12px 14px;
            max-width: 100%;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid var(--sage);
            color: var(--navy);
            font-size: 13px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .actions {
            margin-top: 26px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 44px;
            padding: 12px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--navy);
            color: var(--cream);
        }

        .btn-ghost {
            background: #ffffff;
            color: var(--navy);
            border-color: var(--sage);
        }

        @media (max-width: 520px) {
            .error-card {
                padding: 32px 22px;
                border-radius: 28px;
            }

            h1 {
                font-size: 58px;
            }
        }
    </style>
</head>

<body>
<main class="error-card">
    <div class="icon">🍽️</div>

    <div class="label">404 Not Found</div>

    <h1>404</h1>

    <h2>Trang này không có trong menu.</h2>

    <p>
        Đường dẫn bạn vừa mở không tồn tại hoặc đã bị đổi tên.
        Quay lại menu để chọn đúng món nha.
    </p>

    <div class="path">
        Đường dẫn lỗi:
        <span th:text="${path}">/customer/order</span>
    </div>

    <div class="actions">
        <a class="btn btn-primary" href="/customer/menu">Về menu</a>
        <a class="btn btn-ghost" href="/customer/orders">Đơn hàng của tôi</a>
        <a class="btn btn-ghost" href="/signin">Đăng nhập</a>
    </div>
</main>
</body>
</html>
