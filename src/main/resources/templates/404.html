<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | KhoaFastFood</title>

    <link rel="stylesheet" href="/css/shared.css">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");

        :root {
            --navy: #0A2947;
            --cream: #F3E4C9;
            --brown: #8B5E3C;
            --sage: #D3D4C0;
            --paper: #fffaf3;
            --white: #ffffff;
            --red: #c94832;
            --shadow: 0 24px 70px rgba(10, 41, 71, 0.16);
            --soft: 0 14px 35px rgba(10, 41, 71, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Be Vietnam Pro", Arial, sans-serif;
            color: var(--navy);
            background:
                radial-gradient(circle at 15% 12%, rgba(139, 94, 60, 0.16), transparent 24rem),
                radial-gradient(circle at 88% 86%, rgba(10, 41, 71, 0.12), transparent 28rem),
                linear-gradient(135deg, #fffaf3 0%, #f3e4c9 100%);
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        .page {
            width: min(900px, calc(100% - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            place-items: center;
            padding: 40px 0;
        }

        .card {
            width: 100%;
            padding: 42px;
            display: grid;
            grid-template-columns: 1fr 230px;
            gap: 30px;
            align-items: center;
            border-radius: 38px;
            background: rgba(255, 250, 243, 0.9);
            border: 1px solid rgba(211, 212, 192, 0.9);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            right: -80px;
            top: -90px;
            border-radius: 999px;
            background: rgba(139, 94, 60, 0.12);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: fit-content;
            color: var(--navy);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.7px;
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: var(--brown);
            color: var(--cream);
            box-shadow: var(--soft);
            font-size: 24px;
        }

        .badge {
            width: fit-content;
            margin-top: 30px;
            padding: 8px 13px;
            border-radius: 999px;
            color: var(--red);
            background: rgba(201, 72, 50, 0.10);
            border: 1px solid rgba(201, 72, 50, 0.18);
            font-size: 13px;
            font-weight: 800;
        }

        h1 {
            margin: 16px 0 0;
            font-size: clamp(86px, 14vw, 150px);
            line-height: 0.82;
            letter-spacing: -7px;
            font-weight: 800;
            color: var(--navy);
        }

        h2 {
            margin: 22px 0 0;
            max-width: 560px;
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1;
            letter-spacing: -1.8px;
            font-weight: 800;
            color: var(--navy);
        }

        h2 span {
            color: var(--brown);
        }

        .desc {
            margin: 14px 0 0;
            max-width: 560px;
            color: var(--brown);
            font-size: 15px;
            line-height: 1.7;
        }

        .path {
            margin-top: 18px;
            padding: 12px 14px;
            max-width: 560px;
            border-radius: 18px;
            color: var(--brown);
            background: rgba(243, 228, 201, 0.48);
            border: 1px dashed rgba(139, 94, 60, 0.30);
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .path strong {
            color: var(--navy);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
        }

        .btn {
            min-height: 44px;
            padding: 11px 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 999px;
            color: var(--cream);
            background: var(--navy);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(10, 41, 71, 0.18);
            transition: 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(10, 41, 71, 0.22);
        }

        .btn.secondary {
            color: var(--navy);
            background: var(--white);
            border: 1px solid rgba(211, 212, 192, 0.95);
            box-shadow: none;
        }

        .visual {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            gap: 14px;
        }

        .plate {
            width: 170px;
            height: 170px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background:
                radial-gradient(circle at center, #fffaf3 0 42%, transparent 43%),
                conic-gradient(from 90deg, var(--navy), var(--brown), var(--navy));
            box-shadow: var(--soft);
            font-size: 66px;
        }

        .caption {
            padding: 9px 13px;
            border-radius: 999px;
            color: var(--brown);
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(211, 212, 192, 0.85);
            font-size: 12px;
            font-weight: 800;
            text-align: center;
        }

        @media (max-width: 760px) {
            .card {
                grid-template-columns: 1fr;
                padding: 32px 24px;
                border-radius: 30px;
            }

            .visual {
                order: -1;
            }

            .plate {
                width: 130px;
                height: 130px;
                font-size: 52px;
            }

            h1 {
                letter-spacing: -4px;
                text-align: center;
            }

            h2,
            .desc,
            .path {
                text-align: center;
            }

            .brand,
            .badge,
            .actions {
                margin-left: auto;
                margin-right: auto;
            }

            .actions .btn {
                flex: 1;
                min-width: 150px;
            }
        }
    </style>
</head>

<body>
<main class="page">
    <section class="card">
        <div class="content">
            <a class="brand" href="/">
                <span class="brand-icon">🍔</span>
                <span>KhoaFastFood</span>
            </a>

            <div class="badge">404 Not Found</div>

            <h1>404</h1>

            <h2>
                Trang này không có trong <span>menu.</span>
            </h2>

            <p class="desc">
                Đường dẫn bạn mở không tồn tại hoặc chưa được map trong project.
                Quay lại trang trước hoặc về menu để tiếp tục.
            </p>

            <div class="path">
                Current path: <strong id="current-path">/unknown</strong>
            </div>

            <div class="actions">
                <button class="btn" onclick="goBack()">← Back</button>
                <a class="btn secondary" href="/customer/menu">Go to menu</a>
                <a class="btn secondary" href="/signin">Sign in</a>
            </div>
        </div>

        <div class="visual">
            <div class="plate">🍽️</div>
            <div class="caption">Lost order, not lost appetite</div>
        </div>
    </section>
</main>

<script>
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
            return;
        }

        window.location.href = '/';
    }

    document.getElementById('current-path').textContent =
        window.location.pathname + window.location.search || '/unknown';
</script>
</body>
</html>
