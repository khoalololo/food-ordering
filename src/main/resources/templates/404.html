<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — FoodOrder</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .wrap { text-align:center; max-width:400px; padding:2rem; }
        .code {
          font-family:'Syne',sans-serif; font-weight:800; font-size:7rem;
          line-height:1; letter-spacing:-0.04em;
          background:linear-gradient(135deg, var(--accent), var(--accent2));
          -webkit-background-clip:text; -webkit-text-fill-color:transparent;
          background-clip:text;
        }
        .emoji { font-size:3rem; display:block; margin:0.5rem 0; }
        .title { font-family:'Syne',sans-serif; font-weight:700; font-size:1.35rem; margin-bottom:0.5rem; }
        .msg   { color:var(--muted); font-size:0.9rem; line-height:1.6; margin-bottom:2rem; }
        .actions { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="code">404</div>
    <h1 class="title">Page not found</h1>
    <p class="msg">Looks like this page went out of stock.<br>Let's get you back to something delicious.</p>
    <div class="actions">
        <a href="index.html" class="btn btn-primary">Go home</a>
        <a href="menu.html"  class="btn btn-secondary">Browse menu</a>
        <button class="btn btn-ghost" onclick="history.back()">← Go back</button>
    </div>
</div>
<script src="shared.js"></script>
</body>
</html>
