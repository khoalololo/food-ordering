<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — FoodOrder</title>
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-wrap { width: 100%; max-width: 400px; padding: 1.5rem; }
        .auth-logo { font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; color:var(--accent); text-align:center; margin-bottom:0.25rem; }
        .auth-tagline { text-align:center; color:var(--muted); font-size:0.875rem; margin-bottom:2rem; }
        .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:2rem; }
        .auth-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1.25rem; margin-bottom:1.5rem; }
        .auth-form { display:flex; flex-direction:column; gap:1rem; }
        .auth-footer { text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--muted); }
        .auth-footer a { color:var(--accent); font-weight:500; }
        .auth-footer a:hover { text-decoration:underline; }
        .error-msg { background:rgba(224,82,82,0.1); border:1px solid rgba(224,82,82,0.3); border-radius:var(--radius); padding:0.65rem 0.9rem; font-size:0.875rem; color:var(--red); display:none; }
    </style>
</head>
<body>
<div id="toast-container"></div>
<div class="auth-wrap">
    <div class="auth-logo">FoodOrder</div>
    <p class="auth-tagline">Good food, delivered fast</p>
    <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <div id="error-msg" class="error-msg"></div>
        <form class="auth-form" id="signin-form">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" style="margin-top:0.5rem">
                Sign in
            </button>
        </form>
        <p class="auth-footer">No account? <a href="/signup">Create one</a></p>
    </div>
</div>
<script src="/js/shared.js"></script>
<script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      const role = Auth.role();
      location.href = role === 'STAFF' || role === 'MANAGER' ? '/staff/orders' : '/customer/menu';
    }

    document.getElementById('signin-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        // POST /api/auth/login returns { token, user }
        const data = await POST('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        Auth.set(data.token, data.user);
        const role = data.user?.role;
        location.href = role === 'STAFF' || role === 'MANAGER' ? '/staff/orders' : '/customer/menu';
      } catch (ex) {
        err.textContent = ex.message || 'Invalid email or password';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
</script>
</body>
</html>
